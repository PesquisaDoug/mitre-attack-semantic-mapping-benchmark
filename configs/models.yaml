lexical:
  tfidf:
    lowercase: true
    ngram_range:
      - 1
      - 2
    min_df: 1
    sublinear_tf: true
    max_features: 50000

  bm25:
    implementation: rank_bm25.BM25Okapi

transformers:
  bi_encoder:
    model_id: sentence-transformers/all-MiniLM-L6-v2
    normalize_embeddings: true

  cross_encoder:
    model_id: cross-encoder/ms-marco-MiniLM-L6-v2
    rerank_top_k: 20
