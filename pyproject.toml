[project]
name = "mitre-attack-transformer-semantic-mapping"
version = "0.1.0"
description = "Transformer retrieval and reranking benchmark for mapping CTI procedure descriptions to MITRE ATT&CK techniques."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "transformers>=4.45,<6",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "matplotlib>=3.9",
    "requests>=2.32",
    "joblib>=1.4",
    "streamlit>=1.38",
    "plotly>=5.24",
    "PyYAML>=6.0",
    "pytest>=8.0",
    "jupyter>=1.0",
    "nbconvert>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
